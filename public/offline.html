<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0b0d" />
  <title>RevTrack is offline</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0a0b0d; color: #f4f5f7; font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
    h1 { margin: 0; font-size: 1.6rem; }
    p { margin: 0; color: #8c94a3; max-width: 30ch; }
    button { margin-top: 12px; height: 52px; border: 0; border-radius: 999px; background: #35f2b0; color: #0a0b0d; font-size: 1rem; font-weight: 700; padding: 0 28px; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Your data is safe. Reconnect and RevTrack picks up where you left off.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
